[package]
name = "os"
version = "0.1.0"
edition = "2021"

[dependencies]
bootloader = "0.9.23"
volatile = "0.2.6"                                   
spin = "0.5.2"                                      
lazy_static = { version = "1.0", features = ["spin_no_std"] }  
x86_64 = "0.14.2"                   

[package.metadata.bootimage]
run-args = ["-serial", "stdio"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
